spring.application.name=iam_service
server.servlet.context-path=/

server.port=8189

spring.datasource.url=jdbc:postgresql://localhost:5432/post_hub_local
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# \u0423\u043A\u0430\u0437\u044B\u0432\u0430\u0435\u0442 \u0441\u0445\u0435\u043C\u0443 \u043F\u043E \u0443\u043C\u043E\u043B\u0447\u0430\u043D\u0438\u044E \u0434\u043B\u044F \u0432\u0441\u0435\u0445 JPA-\u0441\u0443\u0449\u043D\u043E\u0441\u0442\u0435\u0439 (@Entity).
spring.jpa.properties.hibernate.default_schema=v1_iam_service
# \u042F\u0432\u043D\u043E \u0443\u043A\u0430\u0437\u044B\u0432\u0430\u0435\u0442 Hibernate, \u0447\u0442\u043E \u043D\u0443\u0436\u043D\u043E \u0438\u0441\u043F\u043E\u043B\u044C\u0437\u043E\u0432\u0430\u0442\u044C \u0434\u0438\u0430\u043B\u0435\u043A\u0442 PostgreSQL \u0434\u043B\u044F \u0433\u0435\u043D\u0435\u0440\u0430\u0446\u0438\u0438 SQL-\u0437\u0430\u043F\u0440\u043E\u0441\u043E\u0432.
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# \u0410\u0432\u0442\u043E\u043C\u0430\u0442\u0438\u0447\u0435\u0441\u043A\u0438 \u043E\u0431\u043D\u043E\u0432\u043B\u044F\u0435\u0442 \u0441\u0445\u0435\u043C\u0443 \u0411\u0414 \u043F\u0440\u0438 \u0437\u0430\u043F\u0443\u0441\u043A\u0435 \u043F\u0440\u0438\u043B\u043E\u0436\u0435\u043D\u0438\u044F \u043D\u0430 \u043E\u0441\u043D\u043E\u0432\u0435 \u0432\u0430\u0448\u0438\u0445 JPA-\u0441\u0443\u0449\u043D\u043E\u0441\u0442\u0435\u0439 (@Entity).
spring.jpa.hibernate.ddl-auto=update

# \u0412\u043A\u043B\u044E\u0447\u0438\u0442\u044C Flyway (\u043F\u043E \u0443\u043C\u043E\u043B\u0447\u0430\u043D\u0438\u044E true)
spring.flyway.enabled=true
# \u041F\u0430\u043F\u043A\u0430 \u0441 \u043C\u0438\u0433\u0440\u0430\u0446\u0438\u044F\u043C\u0438
spring.flyway.locations=classpath:db/migration
#\u0423\u043A\u0430\u0437\u044B\u0432\u0430\u0435\u0442 Flyway \u0441\u0445\u0435\u043C\u0443 \u0411\u0414, \u0432 \u043A\u043E\u0442\u043E\u0440\u043E\u0439 \u0431\u0443\u0434\u0443\u0442 \u0441\u043E\u0437\u0434\u0430\u0432\u0430\u0442\u044C\u0441\u044F \u0442\u0430\u0431\u043B\u0438\u0446\u044B \u043C\u0438\u0433\u0440\u0430\u0446\u0438\u0439 (flyway_schema_history) \u0438 \u043F\u0440\u0438\u043C\u0435\u043D\u044F\u0442\u044C\u0441\u044F \u0441\u043A\u0440\u0438\u043F\u0442\u044B.
spring.flyway.schemas=v1_iam_service

#end.point.posts=/posts
#end.point.id=/{id}


logging.level.com.post_hub.iam_service=TRACE
# \u0412\u043A\u043B\u044E\u0447\u0430\u0435\u0442 DEBUG-\u043B\u043E\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 \u0434\u043B\u044F \u0432\u0441\u0435\u0445 \u043A\u043B\u0430\u0441\u0441\u043E\u0432 Spring, \u0441\u0432\u044F\u0437\u0430\u043D\u043D\u044B\u0445 \u0441 \u0432\u0435\u0431-\u0437\u0430\u043F\u0440\u043E\u0441\u0430\u043C\u0438 (\u043A\u043E\u043D\u0442\u0440\u043E\u043B\u043B\u0435\u0440\u044B, \u0444\u0438\u043B\u044C\u0442\u0440\u044B, MVC).
logging.level.org.springframework.web=DEBUG
# \u0412\u043A\u043B\u044E\u0447\u0430\u0435\u0442 \u043F\u043E\u0434\u0440\u043E\u0431\u043D\u043E\u0435 \u043B\u043E\u0433\u0438\u0440\u043E\u0432\u0430\u043D\u0438\u0435 \u0434\u0435\u0439\u0441\u0442\u0432\u0438\u0439 Flyway (\u043C\u0438\u0433\u0440\u0430\u0446\u0438\u0438 \u0411\u0414).
logging.level.org.flywaydb=DEBUG